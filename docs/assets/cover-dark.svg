<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Terminal Workbench — a portable design system, with a preview of its design tokens">
  <title>Terminal Workbench</title>
  <rect x="0.75" y="0.75" width="1198.5" height="458.5" rx="24" fill="#090c0d" stroke="#2a363d" stroke-width="1.5"/>

  <!-- left column -->
  <text x="68" y="128" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" font-weight="600" letter-spacing="2.2" fill="#63736f">PORTABLE DESIGN SYSTEM</text>
  <text x="66" y="204" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="58" font-weight="700" letter-spacing="0.5" fill="#dce4df">terminal</text>
  <text x="66" y="268" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="58" font-weight="700" letter-spacing="0.5" fill="#dce4df">workbench</text>
  <rect x="372" y="224" width="13" height="44" rx="2" fill="#63f2ab"/>
  <text x="68" y="326" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#879994">Quiet chrome. <tspan fill="#63f2ab" font-weight="600">Loud signal.</tspan></text>
  <text x="68" y="384" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="1.6" fill="#63736f">TOKENS · TYPOGRAPHY · COMPONENTS · DARK + LIGHT</text>

  <!-- right column: mock tokens panel -->
  <rect x="624" y="64" width="512" height="332" rx="14" fill="#13191c" stroke="#2a363d" stroke-width="1.5"/>
  <path d="M638 64 h484 a14 14 0 0 1 14 14 v30 h-512 v-30 a14 14 0 0 1 14 -14 z" fill="#182024"/>
  <line x1="624" y1="108" x2="1136" y2="108" stroke="#2a363d" stroke-width="1"/>
  <circle cx="648" cy="86" r="5.5" fill="#ff6e7a"/>
  <circle cx="668" cy="86" r="5.5" fill="#f0c674"/>
  <circle cx="688" cy="86" r="5.5" fill="#63f2ab"/>
  <text x="714" y="90" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" fill="#63736f">style / tokens.css — dark + light</text>

  <!-- accent swatch row -->
  <rect x="648" y="132" width="56" height="34" rx="6" fill="#63f2ab"/>
  <rect x="722" y="132" width="56" height="34" rx="6" fill="#6bdcff"/>
  <rect x="796" y="132" width="56" height="34" rx="6" fill="#f0c674"/>
  <rect x="870" y="132" width="56" height="34" rx="6" fill="#ff6e7a"/>
  <rect x="944" y="132" width="56" height="34" rx="6" fill="#f7a35c"/>
  <rect x="1018" y="132" width="56" height="34" rx="6" fill="#b78cff"/>

  <!-- surface ramp -->
  <rect x="648" y="180" width="426" height="12" rx="3" fill="#0e1214" stroke="#2a363d" stroke-width="1"/>
  <rect x="648" y="180" width="284" height="12" rx="3" fill="#182024"/>
  <rect x="648" y="180" width="142" height="12" rx="3" fill="#202a2f"/>

  <!-- code sample -->
  <text x="648" y="234" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" fill="#b4c3bd">:root {</text>
  <text x="676" y="262" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15"><tspan fill="#6bdcff">--twb-accent</tspan><tspan fill="#b4c3bd">: </tspan><tspan fill="#63f2ab">#63f2ab</tspan><tspan fill="#b4c3bd">;</tspan></text>
  <text x="676" y="290" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15"><tspan fill="#6bdcff">--twb-bg-0</tspan><tspan fill="#b4c3bd">: </tspan><tspan fill="#63736f">#090c0d</tspan><tspan fill="#b4c3bd">;</tspan></text>
  <text x="676" y="318" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15"><tspan fill="#6bdcff">--twb-radius-m</tspan><tspan fill="#b4c3bd">: </tspan><tspan fill="#f7a35c">6px</tspan><tspan fill="#b4c3bd">;</tspan></text>
  <text x="648" y="346" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="15" fill="#b4c3bd">}</text>

  <!-- prompt line -->
  <text x="648" y="380" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13"><tspan fill="#63f2ab" font-weight="700">❯</tspan><tspan fill="#879994"> both modes verified · AA contrast</tspan></text>
</svg>
